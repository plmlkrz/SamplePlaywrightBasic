<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout: Overview · Demo Store</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <p class="app-title">Demo Store</p>
  </header>

  <main id="main">
    <h1>Checkout: Overview</h1>
    <div id="summary-items" aria-busy="true">Loading order…</div>

    <div class="summary-totals">
      <p class="summary_subtotal_label">Item total: $0.00</p>
      <p class="summary_tax_label">Tax: $0.00</p>
      <p class="summary_total_label">Total: $0.00</p>
    </div>

    <p>
      <button class="secondary" data-test="cancel" type="button">Cancel</button>
      <button data-test="finish" type="button">Finish</button>
    </p>
  </main>

  <script src="/js/store.js"></script>
  <script>
    if (Store.requireAuth()) {
      const TAX_RATE = 0.08;

      document.querySelector('[data-test="cancel"]').addEventListener('click', () => {
        window.location.assign('/inventory.html');
      });

      document.querySelector('[data-test="finish"]').addEventListener('click', () => {
        Store.clearCart();
        window.location.assign('/checkout-complete.html');
      });

      Store.fetchProducts().then((products) => {
        const byIndex = new Map(products.map((p) => [p.cartIndex, p]));
        const cart = Store.getCart();
        const items = cart.map((i) => byIndex.get(i)).filter(Boolean);

        document.getElementById('summary-items').removeAttribute('aria-busy');
        document.getElementById('summary-items').innerHTML = items.map((p) => `
          <div class="cart_item">
            <span class="cart_quantity">1</span>
            <span class="inventory_item_name">${p.name}</span>
            <span class="inventory_item_price">${Store.formatPrice(p.price)}</span>
          </div>`).join('') || '<p data-test="empty-cart">No items.</p>';

        const subtotal = items.reduce((sum, p) => sum + p.price, 0);
        const tax = subtotal * TAX_RATE;
        const total = subtotal + tax;

        document.querySelector('.summary_subtotal_label').textContent = 'Item total: ' + Store.formatPrice(subtotal);
        document.querySelector('.summary_tax_label').textContent = 'Tax: ' + Store.formatPrice(tax);
        document.querySelector('.summary_total_label').textContent = 'Total: ' + Store.formatPrice(total);
      });
    }
  </script>
</body>
</html>
