<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products · Demo Store</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <p class="app-title">Demo Store</p>
    <nav class="cart-link-wrap" aria-label="Cart">
      <a class="shopping_cart_link" href="/cart.html" aria-label="Cart">
        🛒 <span class="shopping_cart_badge" hidden></span>
      </a>
    </nav>
  </header>

  <main id="main">
    <div class="toolbar">
      <h1>Products</h1>
      <label for="sort" class="visually-shown">
        Sort
        <select id="sort" data-test="product-sort-container">
          <option value="az">Name (A to Z)</option>
          <option value="za">Name (Z to A)</option>
          <option value="lohi">Price (low to high)</option>
          <option value="hilo">Price (high to low)</option>
        </select>
      </label>
    </div>

    <div class="inventory_list" id="inventory-list" aria-busy="true">Loading products…</div>
  </main>

  <script src="/js/store.js"></script>
  <script>
    if (Store.requireAuth()) {
      let products = [];

      function sortProducts(list, mode) {
        const sorted = [...list];
        switch (mode) {
          case 'za': sorted.sort((a, b) => b.name.localeCompare(a.name)); break;
          case 'lohi': sorted.sort((a, b) => a.price - b.price); break;
          case 'hilo': sorted.sort((a, b) => b.price - a.price); break;
          default: sorted.sort((a, b) => a.name.localeCompare(b.name));
        }
        return sorted;
      }

      function buttonFor(product) {
        const inCart = Store.getCart().includes(product.cartIndex);
        const id = inCart ? `remove-${product.id}` : `add-to-cart-${product.id}`;
        const label = inCart ? 'Remove' : 'Add to cart';
        const cls = inCart ? 'secondary' : '';
        return `<button id="${id}" class="${cls}" data-index="${product.cartIndex}">${label}</button>`;
      }

      function render() {
        const mode = document.getElementById('sort').value;
        const list = document.getElementById('inventory-list');
        list.removeAttribute('aria-busy');
        list.innerHTML = sortProducts(products, mode).map((p) => `
          <article class="inventory_item">
            <h2 class="inventory_item_name">${p.name}</h2>
            <p class="inventory_item_desc">${p.description}</p>
            <p class="inventory_item_price">${Store.formatPrice(p.price)}</p>
            ${buttonFor(p)}
          </article>
        `).join('');
        Store.renderBadge();
      }

      document.getElementById('inventory-list').addEventListener('click', (event) => {
        const btn = event.target.closest('button');
        if (!btn) return;
        const index = Number(btn.dataset.index);
        if (btn.id.startsWith('add-to-cart')) Store.addToCart(index);
        else Store.removeFromCart(index);
        render();
      });

      document.getElementById('sort').addEventListener('change', render);

      Store.fetchProducts().then((data) => {
        products = data;
        render();
      });
    }
  </script>
</body>
</html>
