name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Official Playwright image ships all browsers + OS deps preinstalled, so we
    # skip the flaky `playwright install --with-deps` apt step entirely.
    # Keep this tag in sync with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      # The demo app is started automatically by the webServer block in
      # playwright.config.ts — no separate "start app" step needed.
      run: npx playwright test
      env:
        TEST_ENV: ci
        # In the Playwright container, GitHub Actions sets HOME=/github/home (owned
        # by a different user), which makes Firefox refuse to launch. Point HOME at
        # the container's root home so all browsers start.
        HOME: /root
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
